services:
  relay:
    build: .
    image: cs-relay:0.7.0
    container_name: cs-relay
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
