services:
  relay:
    build: .
    image: cs-relay:0.4.7
    container_name: cs-relay
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    depends_on:
      - gopeed
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gopeed:
    image: liwei2633/gopeed:latest
    container_name: cs-gopeed
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - UMASK=022
    volumes:
      - ./data:/data
    # 只在内网可达；不映射到宿主机，避免暴露下载器 UI
    expose:
      - "9999"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
